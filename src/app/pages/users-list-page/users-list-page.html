<div class="page-header">
  <h2 nz-typography>Список пользователей</h2>
  <button nz-button nzType="primary" routerLink="/users/new">
    <span nz-icon nzType="plus"></span>
    Добавить
  </button>
</div>

@if (loading()) {
  <div class="users-list">
    @for (_ of [1, 2, 3, 4, 5, 6]; track $index) {
      <nz-card class="user-card" [nzHoverable]="false">
        <nz-skeleton
          [nzAvatar]="true"
          [nzActive]="true"
          [nzParagraph]="{ rows: 1 }"
        />
      </nz-card>
    }
  </div>
} @else if (error()) {
  <nz-result nzStatus="error" [nzTitle]="error() || 'Ошибка'" />
} @else {
  <div class="users-section">
    <div class="search-bar">
      <nz-input-search style="border-radius: 30px" nzAllowClear>
        <input nz-input [(ngModel)]="searchQuery" placeholder="Найти пользователя" />
      </nz-input-search>
      <nz-select
        [ngModel]="filterField()"
        (ngModelChange)="onFilterFieldChange($event)"
        style="width: 120px"
      >
        <nz-option nzValue="name" nzLabel="Имя" />
        <nz-option nzValue="email" nzLabel="Email" />
      </nz-select>
    </div>

    <div class="users-list">
      @for (user of paginatedUsers(); track user.id) {
        <nz-card class="user-card" [nzLoading]="loading()" (click)="onUserClick(user.id)">
          <div class="user-meta">
            <div class="user-avatar">
              {{ user.name.charAt(0) }}
            </div>
            <div class="user-info">
              <div class="user-name">{{ user.name }}</div>
              <div class="user-email">{{ user.email }}</div>
            </div>
            <span nz-icon nzType="right" style="color: var(--gray-400)"></span>
          </div>
          <div class="user-details">
            <span>
              <span nz-icon nzType="environment"></span>
              {{ user.address.city }}
            </span>
            <span>
              <span nz-icon nzType="phone"></span>
              {{ user.phone }}
            </span>
            <span>
              <span nz-icon nzType="global"></span>
              {{ user.website }}
            </span>
          </div>
        </nz-card>
      }
    </div>
    <nz-pagination
      [nzPageIndex]="currentPage()"
      [nzTotal]="filteredUsers().length"
      [nzPageSize]="pageSize()"
      (nzPageIndexChange)="onPageChange($event)"
    />
  </div>
}
